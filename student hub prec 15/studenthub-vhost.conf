# ==============================================================================
# StudentHub Apache Virtual Host Configuration (Practical 15)
# Problem Definition:
# Integrate all modules into a single deployable StudentHub portal.
# Verify navigation, responsiveness, authentication, database operations,
# security checks, AJAX functionality, and documentation.
# Deploy locally using XAMPP/Apache virtual host and submit GitHub repository.
# ==============================================================================
#
# QUICK SETUP INSTRUCTIONS:
# 1. Open C:\xampp\apache\conf\extra\httpd-vhosts.conf and append this file.
# 2. Open C:\Windows\System32\drivers\etc\hosts in Notepad as Administrator and add:
#       127.0.0.1    studenthub.local
#       ::1          studenthub.local
# 3. Restart Apache from the XAMPP Control Panel.
# 4. Open your browser and navigate to: http://studenthub.local
# ==============================================================================

# 1. Default localhost VirtualHost (Preserves standard http://localhost/ access)
<VirtualHost *:80>
    DocumentRoot "C:/xampp/htdocs"
    ServerName localhost
</VirtualHost>

# 2. Dedicated StudentHub VirtualHost
<VirtualHost *:80>
    ServerAdmin admin@charusat.edu.in
    DocumentRoot "C:/xampp/htdocs/WDF/student hub prec 15"
    ServerName studenthub.local
    ServerAlias www.studenthub.local
    DirectoryIndex index.php index.html

    <Directory "C:/xampp/htdocs/WDF/student hub prec 15">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "logs/studenthub-error.log"
    CustomLog "logs/studenthub-access.log" common
</VirtualHost>
