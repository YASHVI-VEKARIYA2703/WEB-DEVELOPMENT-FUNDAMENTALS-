<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <style>
        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:#f2f2f2;
        }

        h1{
            text-align:center;
            background:rgb(35, 53, 92);
            padding:15px;
        }

        p{
            text-align:center;
            background:rgb(209, 241, 149);
            color:white;
            padding:10px;
        }

        .container{
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:30px;
            width:80%;
            margin:40px auto;
        }

        .box button{
            width:100%;
            height:250px;
            font-size:28px;
            font-weight:bold;
            background:beige;
            border:2px solid black;
            border-radius:10px;
            cursor:pointer;
        }

        .box button:hover{
            background:rgb(204, 255, 163);
        }

        a{
            text-decoration:none;
        }
    </style>
</head>
<body>

<h1>Dashboard</h1>
<p>WELCOME TO STUDENT HUB PORTAL</p>

<div class="container">

    <div class="box">
        <a href="../pages/attendence.html">
            <button>ATTENDANCE</button>
        </a>
    </div>

    <div class="box">
        <a href="../pages/result.html">
            <button>RESULT</button>
        </a>
    </div>

    <div class="box">
        <a href="../pages/fees.html">
            <button>FEES</button>
        </a>
    </div>

    <div class="box">
        <a href="../pages/timetable.html">
            <button>TIME TABLE</button>
        </a>
    </div>

</div>

</body>
</html>
