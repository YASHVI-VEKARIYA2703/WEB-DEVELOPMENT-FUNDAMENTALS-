<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Hub</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body class="login-body">
    
    <!-- HEADER -->
    <iframe
        src="/pages/header.html"
        class="header-frame">
    </iframe>

    <h1 class="page-title">STUDENT LOGIN</h1>

    <!-- NAVIGATION -->
    <nav>
        <a href="dashboard.html">DASHBOARD</a>
        <a href="event.html">EVENTS</a>
        <a href="course.html">COURSES</a>
        <a href="register.html">REGISTER</a>
        <a href="login.html" class="active">LOGIN</a>
        <a href="contact.html">CONTACT</a>
    </nav>

    <!-- LOGIN FORM BOX -->
    <div class="form-box">
        <h2>Student Login</h2>

        <form action="dashboard.html" method="get">
            <label for="username">Enrollment No / ID:</label>
            <input type="text" id="username" name="username" placeholder="Enter Enrollment ID" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter Password" required>

            <input type="submit" value="Login">

            <p style="text-align: center; margin-top: 15px; font-size: 14px;">
                Don't have an account? <a href="register.html" style="color: blue; font-weight: bold;">Register Here</a>
            </p>
        </form>
    </div>

    <!-- HOME BUTTON AT BOTTOM RIGHT -->
    <a href="../index.html" class="home-btn">🏠 Home</a>

    <!-- FOOTER -->
    <footer>
        &copy; 2026 STUDENT HUB • CHARUSAT University • All Rights Reserved.
    </footer>

</body>
</html>
