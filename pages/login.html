<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Hub - Login</title>

    <style>
        body{
            margin:0;
            font-family: Arial, sans-serif;
            background-color:#dbeafe;
        }

        h1{
            text-align:center;
            color:rgb(28,40,65);
            font-family:'Times New Roman', Times, serif;
            margin-top:30px;
        }

        #form{
            width:350px;
            margin:40px auto;
            background:white;
            padding:25px;
            border-radius:8px;
            box-shadow:0 0 10px gray;
        }

        h2{
            text-align:center;
            color:rgb(28,40,65);
            margin-bottom:20px;
        }

        label{
            font-weight:bold;
        }

        input[type="text"],
        input[type="password"]{
            width:100%;
            padding:8px;
            margin-top:5px;
            margin-bottom:15px;
            border:1px solid gray;
            border-radius:4px;
        }

        input[type="submit"]{
            width:100%;
            padding:10px;
            background-color:rgb(28,40,65);
            color:white;
            border:none;
            border-radius:4px;
            cursor:pointer;
        }

        input[type="submit"]:hover{
            background-color:rgb(45,65,100);
        }

        footer{
            background-color:rgb(28,40,65);
            color:white;
            text-align:center;
            padding:12px;
            margin-top:180px;
        }
    </style>
</head>

<body>

    <h1>STUDENT HUB</h1>

    <div id="form">

        <h2>Login</h2>

        <form action="../pages/dashboard.html">

            <label for="username">Username</label><br>
            <input type="text" id="username" name="username" placeholder="Enter Username" required>

            <label for="password">Password</label><br>
            <input type="password" id="password" name="password" placeholder="Enter Password" required>

            <input type="submit" value="Login">

        </form>

    </div>

    <footer>
        &copy; 2026 STUDENT HUB
    </footer>

</body>
</html>
