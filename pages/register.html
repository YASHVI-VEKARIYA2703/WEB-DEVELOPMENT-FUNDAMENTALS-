<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - Student Hub</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body class="register-body">

    <!-- HEADER -->
    <iframe
        src="/pages/header.html"
        class="header-frame">
    </iframe>

    <h1 class="page-title">STUDENT REGISTRATION</h1>

    <!-- NAVIGATION -->
    <nav>
        <a href="dashboard.html">DASHBOARD</a>
        <a href="event.html">EVENTS</a>
        <a href="course.html">COURSES</a>
        <a href="register.html" class="active">REGISTER</a>
        <a href="login.html">LOGIN</a>
        <a href="contact.html">CONTACT</a>
    </nav>
    
    <!-- REGISTRATION FORM BOX -->
    <div class="form-box">
        <h2>Create Account</h2>

        <form action="login.html" method="get">
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" placeholder="Enter Full Name" required>

            <label for="enrollment">Enrollment No:</label>
            <input type="text" id="enrollment" placeholder="Enter Enrollment No" required>

            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Enter Email Address" required>

            <label for="mobile">Mobile Number:</label>
            <input type="tel" id="mobile" placeholder="Enter Mobile Number" required>

            <label for="department">Department:</label>
            <select id="department">
                <option>Computer Engineering</option>
                <option>Information Technology</option>
                <option>Computer Science &amp; Engineering</option>
                <option>Electronics &amp; Communication</option>
            </select>

            <label for="semester">Semester:</label>
            <select id="semester">
                <option>Semester 1</option>
                <option>Semester 2</option>
                <option selected>Semester 3</option>
                <option>Semester 4</option>
                <option>Semester 5</option>
                <option>Semester 6</option>
                <option>Semester 7</option>
                <option>Semester 8</option>
            </select>

            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="Enter Password" required>

            <label for="cpassword">Confirm Password:</label>
            <input type="password" id="cpassword" placeholder="Re-enter Password" required>

            <input type="submit" value="Register Now">
            <input type="reset" value="Clear Form">

            <p style="text-align: center; margin-top: 15px; font-size: 14px;">
                Already registered? <a href="login.html" style="color: blue; font-weight: bold;">Login here</a>
            </p>
        </form>
    </div>

    <!-- HOME BUTTON AT BOTTOM RIGHT -->
    <a href="../index.html" class="home-btn">🏠 Home</a>

    <!-- FOOTER -->
    <footer>
        &copy; 2026 STUDENT HUB • CHARUSAT University • All Rights Reserved.
    </footer>

</body>
</html>
