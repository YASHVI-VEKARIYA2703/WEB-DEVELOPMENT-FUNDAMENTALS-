<!DOCTYPE html>
<html lang="en">

<head>
    <title>KYA APPLICATION</title>
    <link rel="stylesheet" href="../CSS/kyaapplication.css">
    <style>
    body{
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
    }

    h1{
        background-color: rgb(35,53,92);
        color: white;
        padding: 15px;
    }

    table{
        background-color: white;
        padding: 20px;
        border: 1px solid black;
    }

    td{
        padding: 10px;
    }

    input{
        width: 200px;
        padding: 5px;
    }
</style>
</head>

<body>

    <h1 align="center">KYA APPLICATION FORM</h1>

    <table align="center">

        <tr>
            <td><b>NAME</b></td>
            <td>
                <input type="text" id="name" placeholder="Enter Name">
            </td>
        </tr>

        <tr>
            <td><b>ID</b></td>
            <td>
                <input type="text" id="id" placeholder="Enter ID">
            </td>
        </tr>

    </table>

</body>

</html>
